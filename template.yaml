abstract: |
  <div style="background-color: #faf9f5; padding: 20px 25px; border-radius: 10px; font-size: 1.0em; line-height: 1.6; color: #333;">
  <p>
    Robotic <strong>loco-manipulation</strong> requires coordinated control of both contact <strong>force</strong> and <strong>position</strong>, yet many <strong>visuomotor policies</strong> treat them separately.
    We propose a <strong>unified control policy</strong> for <strong>legged robots</strong> that jointly models <strong>force and position</strong> — learned <strong>without force sensors</strong>.
    By simulating diverse interactions, the policy estimates contact forces from past states and compensates via <strong>position</strong> and <strong>velocity</strong> adjustments.
    Such a policy enables a wide range of <strong>manipulation behaviors</strong> under varying combinations of force and position inputs, including <strong>position tracking</strong>, <strong>force application</strong>, <strong>force tracking</strong>, and <strong>compliant robot behaviors</strong>.
    Additionally, we demonstrate that the learned policy enhances trajectory-based imitation learning pipelines by incorporating essential contact information through its force estimation module,
    achieving approximately <strong>~39.5%</strong> higher success rates across four challenging contact-rich manipulation tasks compared to position-control policies.
    Experiments on both a <strong>quadruped</strong> and a <strong>humanoid</strong> demonstrate the <strong>robustness</strong> and <strong>versatility</strong> of our method across diverse scenarios.
  </p>
  </div>

body:
  # - title: Method
  #   text: |
  #     <div className="uk-responsive-width">
  #       <img src="pipeline.png" alt="Method" />
  #     </div>
  #     Our goal is to learn a policy that enables dexterous robotic hands to accurately replicate given human hand–object interaction trajectories in simulation, while satisfying the task's semantic manipulation constraints. The key insight of <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>UnifiedForce</span> is to approach this transfer as a two-stage process: first, a pre-training trajectory imitation stage focusing solely on hand motion, and second, a specific action fine-tuning stage that addresses interaction constraints. In the initial stage, we develop a robust generalist model, pre-trained on large-scale human demonstrations, which learns to mimic human hand motions accurately. Building upon this, we then employ a residual learning module to refine the robot's actions incrementally. This refinement concentrates on two critical aspects: (1) ensuring stable contact with object surfaces under physical constraints to enable effective object manipulation, and (2) coordinating both hands to achieve precise, high-fidelity execution of complex bimanual operations.
